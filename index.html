<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fermer Oyunu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(#8fd3f4, #cdeffd);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
    user-select: none;
    touch-action: manipulation;
  }
  #select {
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    background: #fff; padding: 24px; border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.2); width: min(90vw, 340px);
  }
  #select h1 { font-size: 1.4rem; text-align: center; }
  .choice {
    width: 100%; font-size: 1.2rem; padding: 14px; border: none; border-radius: 12px;
    background: #4caf50; color: #fff; cursor: pointer;
  }
  .choice:disabled { background: #aaa; cursor: not-allowed; }
  #status { font-size: .95rem; color: #333; text-align: center; min-height: 1.2em; }

  #game { display: none; flex-direction: column; align-items: center; gap: 8px; }
  #info { color: #fff; font-weight: bold; text-shadow: 0 1px 3px #000; text-align: center; min-height: 1.2em; }
  #hint { color: #fff; font-size: .85rem; text-shadow: 0 1px 3px #000; text-align: center; }
  #map {
    position: relative;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    width: min(95vw, 420px);
    aspect-ratio: 1;
    border: 4px solid #5d4037;
    border-radius: 8px;
    overflow: hidden;
    background: #7cb342;
  }
  .tile { background: #8bc34a; border: 1px solid #689f38; }
  .player {
    position: absolute;
    width: 10%;
    height: 10%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(16px, 4.5vw, 26px);
    transition: left .15s linear, top .15s linear;
    pointer-events: none;
    z-index: 2;
  }
  .player .tag {
    position: absolute; top: -14px; font-size: 10px; background: rgba(0,0,0,.6);
    color: #fff; padding: 1px 4px; border-radius: 4px; white-space: nowrap;
  }

  /* Joystick: yalnÄ±z toxunuÅŸlu ekranlarda (telefon) gÃ¶rÃ¼nÃ¼r */
  #joy {
    display: none;
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    border: 3px solid rgba(0,0,0,.25);
    touch-action: none;
    margin-top: 6px;
  }
  @media (pointer: coarse) {
    #joy { display: block; }
    #hint { display: none; }
  }
  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    border: 2px solid rgba(0,0,0,.2);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="select">
  <h1>Karakterini seÃ§</h1>
  <button class="choice" id="btn-boy" data-role="boy">ğŸ‘¦ OÄŸlan</button>
  <button class="choice" id="btn-girl" data-role="girl">ğŸ‘§ QÄ±z</button>
  <div id="status">YÃ¼klÉ™nir...</div>
</div>

<div id="game">
  <div id="info"></div>
  <div id="hint">HÉ™rÉ™kÉ™t: W A S D vÉ™ ya ox dÃ¼ymÉ™lÉ™ri</div>
  <div id="map"></div>
  <div id="joy"><div id="knob"></div></div>
</div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   Firebase konfiqurasiyasÄ±
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCWli-LygY7f2KoPgCVpWpb2PsnlLWNFwM",
  authDomain: "wevillage-1102.firebaseapp.com",
  databaseURL: "https://wevillage-1102-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wevillage-1102",
  storageBucket: "wevillage-1102.firebasestorage.app",
  messagingSenderId: "790485485366",
  appId: "1:790485485366:web:8b4ead34a2208620601597"
};
/* ============================================================ */

const SIZE = 10;
const ROOM = "main";
const STEP_MS = 170; // hÉ™rÉ™kÉ™t sÃ¼rÉ™ti (kiÃ§ik = sÃ¼rÉ™tli)
const CHARS = {
  boy:  { emoji: "ğŸ‘¦", name: "OÄŸlan", start: { x: 1, y: 1 } },
  girl: { emoji: "ğŸ‘§", name: "QÄ±z",  start: { x: 8, y: 8 } }
};

const statusEl = document.getElementById("status");
const selectEl = document.getElementById("select");
const gameEl   = document.getElementById("game");
const infoEl   = document.getElementById("info");
const mapEl    = document.getElementById("map");
const joyEl    = document.getElementById("joy");
const knobEl   = document.getElementById("knob");
const buttons  = document.querySelectorAll(".choice");

const configured = !firebaseConfig.apiKey.startsWith("YOUR_");

if (!configured) {
  statusEl.textContent = "Firebase konfiqurasiyasÄ± doldurulmayÄ±b.";
  buttons.forEach(b => b.disabled = true);
} else {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const playersRef = db.ref(`rooms/${ROOM}/players`);

  let myRole = null;
  let myPos = { x: 0, y: 0 };
  let players = {};
  const playerEls = {};

  // XÉ™ritÉ™ xanalarÄ± (yalnÄ±z vizual)
  for (let i = 0; i < SIZE * SIZE; i++) {
    const tile = document.createElement("div");
    tile.className = "tile";
    mapEl.appendChild(tile);
  }

  // ---------- HÉ™rÉ™kÉ™t nÉ™zarÉ™ti ----------
  let timer = null;
  let joyDir = { dx: 0, dy: 0 };
  const heldKeys = [];
  const KEYS = {
    w: [0, -1], arrowup: [0, -1],
    s: [0, 1],  arrowdown: [0, 1],
    a: [-1, 0], arrowleft: [-1, 0],
    d: [1, 0],  arrowright: [1, 0]
  };

  function currentDir() {
    if (heldKeys.length) {
      const [dx, dy] = KEYS[heldKeys[heldKeys.length - 1]];
      return { dx, dy };
    }
    return joyDir;
  }

  function move(dx, dy) {
    if (!myRole) return;
    const nx = Math.min(SIZE - 1, Math.max(0, myPos.x + dx));
    const ny = Math.min(SIZE - 1, Math.max(0, myPos.y + dy));
    if (nx === myPos.x && ny === myPos.y) return;
    myPos = { x: nx, y: ny };
    playersRef.child(myRole).update({ x: nx, y: ny });
  }

  function tick() {
    const d = currentDir();
    if (!d.dx && !d.dy) { stopMoving(); return; }
    move(d.dx, d.dy);
  }

  function startMoving() {
    if (timer) return;
    tick();
    timer = setInterval(tick, STEP_MS);
  }

  function stopMoving() {
    clearInterval(timer);
    timer = null;
  }

  // KompÃ¼ter: klaviatura
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (!KEYS[k]) return;
    e.preventDefault();
    if (!heldKeys.includes(k)) {
      heldKeys.push(k);
      startMoving();
    }
  });

  document.addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    const i = heldKeys.indexOf(k);
    if (i !== -1) heldKeys.splice(i, 1);
  });

  // Telefon: joystick
  function setJoyFromEvent(e) {
    const r = joyEl.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy);
    const max = r.width / 2 - 28;
    if (dist > max) {
      dx = (dx / dist) * max;
      dy = (dy / dist) * max;
    }
    knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    const deadZone = 18;
    if (dist < deadZone) {
      joyDir = { dx: 0, dy: 0 };
    } else if (Math.abs(dx) > Math.abs(dy)) {
      joyDir = { dx: Math.sign(dx), dy: 0 };
    } else {
      joyDir = { dx: 0, dy: Math.sign(dy) };
    }
  }

  joyEl.addEventListener("pointerdown", e => {
    if (!myRole) return;
    joyEl.setPointerCapture(e.pointerId);
    setJoyFromEvent(e);
    startMoving();
  });

  joyEl.addEventListener("pointermove", e => {
    if (!joyEl.hasPointerCapture(e.pointerId)) return;
    setJoyFromEvent(e);
  });

  function releaseJoy() {
    joyDir = { dx: 0, dy: 0 };
    knobEl.style.transform = "translate(-50%, -50%)";
  }
  joyEl.addEventListener("pointerup", releaseJoy);
  joyEl.addEventListener("pointercancel", releaseJoy);

  // ---------- QoÅŸulma ----------
  buttons.forEach(btn => {
    btn.addEventListener("click", () => joinAs(btn.dataset.role));
  });

  async function joinAs(role) {
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = "QoÅŸulur...";

    const slotRef = playersRef.child(role);
    const result = await slotRef.transaction(current => {
      if (current) return; // artÄ±q tutulub
      return {
        name: CHARS[role].name,
        emoji: CHARS[role].emoji,
        x: CHARS[role].start.x,
        y: CHARS[role].start.y
      };
    });

    if (!result.committed) {
      statusEl.textContent = "Bu karakter artÄ±q tutulub. DigÉ™rini seÃ§in.";
      buttons.forEach(b => {
        if (b.dataset.role !== role) b.disabled = false;
      });
      return;
    }

    myRole = role;
    myPos = { x: CHARS[role].start.x, y: CHARS[role].start.y };
    slotRef.onDisconnect().remove();

    selectEl.style.display = "none";
    gameEl.style.display = "flex";
    updateInfo();
  }

  function updateInfo() {
    if (!myRole) return;
    const other = myRole === "boy" ? "girl" : "boy";
    const waiting = !players[other];
    infoEl.textContent =
      `SÉ™n: ${CHARS[myRole].emoji} ${CHARS[myRole].name}` +
      (waiting ? " â€” digÉ™r oyunÃ§u gÃ¶zlÉ™nilir..." : "");
  }

  // ---------- Real-time sinxronizasiya ----------
  playersRef.on("value", snap => {
    players = snap.val() || {};
    render();
  });

  function render() {
    Object.keys(playerEls).forEach(role => {
      if (!players[role]) {
        playerEls[role].remove();
        delete playerEls[role];
      }
    });

    Object.entries(players).forEach(([role, p]) => {
      let el = playerEls[role];
      if (!el) {
        el = document.createElement("div");
        el.className = "player";
        el.innerHTML = `<span>${p.emoji}</span><span class="tag"></span>`;
        mapEl.appendChild(el);
        playerEls[role] = el;
      }
      el.querySelector(".tag").textContent = role === myRole ? "SÉ™n" : p.name;
      el.style.left = `${p.x * 10}%`;
      el.style.top  = `${p.y * 10}%`;
    });

    updateInfo();
  }
}
</script>
</body>
</html>
