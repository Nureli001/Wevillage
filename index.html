<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(#8fd3f4, #cdeffd);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
    user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #select {
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    background: #fff; padding: 24px; border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.2); width: min(90vw, 340px);
  }
  #select h1 { font-size: 1.4rem; text-align: center; }
  .choice {

  .choice:disabled { background: #aaa; cursor: not-allowed; }
  #status { font-size: .95rem; color: #333; text-align: center; min-height: 1.2em; }

  #game { display: none; flex-direction: column; align-items: center; gap: 6px; }
  #topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    color: #fff; text-shadow: 0 1px 3px #000; font-size: .9rem; font-weight: bold;
    width: 100%;
  }
  #info { flex: 1; min-height: 1.2em; }
  #topbar .right { display: flex; align-items: center; gap: 8px; }
  #hint { color: #fff; font-size: .8rem; text-shadow: 0 1px 3px #000; text-align: center; }
  #world {
    display: block;
    border: 4px solid #5d4037;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);

  }
  #bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 36px; }
  #toast { color: #fff; font-size: .85rem; text-shadow: 0 1px 3px #000; text-align: right; flex: 1; }

  .btn {
    border: none; border-radius: 8px; background: #4caf50; color: #fff;
    padding: 8px 12px; font-size: .9rem; cursor: pointer;

  .btn.small { padding: 6px 10px; font-size: .85rem; }
  .btn.danger { background: #e53935; }
  .btn:disabled { background: #bbb; cursor: not-allowed; }

  #joy {
    display: none;
    position: relative;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    border: 3px solid rgba(0,0,0,.25);
    touch-action: none;
    margin-top: 2px;
  }
  @media (pointer: coarse) {
    #joy { display: block; }
    #hint { display: none; }
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,.9); border: 2px solid rgba(0,0,0,.2);
    transform: translate(-50%, -50%); pointer-events: none;
  }

  /* Modals */
  .modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    align-items: center; justify-content: center;
    z-index: 10;
    padding: 12px;
  }
  .modal.open { display: flex; }
  .card {
    background: #fff8e1;
    border: 3px solid #8d6e63;
    border-radius: 14px;
    padding: 16px;
    width: min(92vw, 340px);
    display: flex; flex-direction: column; gap: 12px;
    color: #3e2723;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .card .head { display: flex; justify-content: space-between; align-items: center; }
  .card h2 { font-size: 1.1rem; }
  #coinsModal { font-weight: bold; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 10px; padding: 10px;
    box-shadow: 0 2px 4px rgba(0,0,0,.12);
  }
  .row .grow { flex: 1; font-size: .9rem; }
  .row .grow small { color: #6d4c41; }
  .icon.soil {
    width: 44px; height: 44px; border-radius: 6px; border: 2px solid #6b4a2b; flex-shrink: 0;
    background: #8d6a46;
  }
  .icon.seed {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 50% 40%, #fbc02d 0 30%, #a1887f 34% 100%);
    border: 2px solid #6d4c41;
  }
  .barnPrev { width: 100%; border-radius: 10px; background: #fff; }
  .bar { height: 14px; background: #e0d6c8; border-radius: 8px; overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: linear-gradient(#ffb74d, #ef6c00); transition: width .3s; }
  #barText { font-size: .85rem; text-align: center; }
</style>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCWli-LygY7f2KoPgCVpWpb2PsnlLWNFwM",
  authDomain: "wevillage-1102.firebaseapp.com",
  databaseURL: "https://wevillage-1102-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wevillage-1102",
  storageBucket: "wevillage-1102.firebasestorage.app",
  messagingSenderId: "790485485366",
  appId: "1:790485485366:web:8b4ead34a2208620601597"
};

// ---------- Settings ----------
const ROOM_ID = "main";
const W = 1600, H = 1000;     // world size in units
const VW = 480;               // visible width in units (camera)
const SPEED = 150;            // units per second
const R = 12;                 // player collision radius
const SEND_MS = 100;          // network throttle
const IDLE_MS = 20000;        // remove character after this much inactivity
const CELL = 64;              // soil cell size (grid)
const SOIL = { price: 50, refund: 25 };
const SEED_PRICE = 10;
const WHEAT_YIELD = 3;        // wheat added to warehouse per harvest
const WAREHOUSE_CAP = 40;     // total storage capacity of the barn
const GROW_MS = 30000;        // wheat growth time
const START_COINS = 300;
const BARN = { x: 420, y: 270, w: 170, h: 120 };

const CHARS = {
  boy:  { name: "O\u011Flan", color: "#3f7cd9", start: { x: 360, y: 420 } },
  girl: { name: "Q\u0131z",   color: "#e0609a", start: { x: 1000, y: 620 } }
};

// Lake and waterfall geometry
const LAKE = { cx: 120, cy: 480, rx: 125, ry: 80 };
const FALL = { x0: 62, x1: 124, y0: 150, y1: 402 };

// Dirt path
const PATH = [[300, 1000], [420, 760], [700, 640], [900, 560], [1150, 600], [1400, 780], [1600, 800]];

function pathSamples() {
  const pts = [];
  for (let i = 0; i < PATH.length - 1; i++) {
    const [ax, ay] = PATH[i], [bx, by] = PATH[i + 1];
    const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 20);
    for (let k = 0; k <= n; k++) pts.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]);
  }
  return pts;
}
const PATH_PTS = pathSamples();

function rng(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function genTrees() {
  const r = rng(7);
  const list = [];
  for (let i = 0; i < 90; i++) {
    const x = 40 + r() * (W - 80), y = 40 + r() * (H - 80);
    if (x < 240 && y < 700) continue;
    if (Math.hypot(x - 760, y - 460) < 170) continue;
    if (PATH_PTS.some(([px, py]) => Math.hypot(px - x, py - y) < 55)) continue;
    if (x > BARN.x - 40 && x < BARN.x + BARN.w + 40 && y > BARN.y - 40 && y < BARN.y + BARN.h + 40) continue;
    list.push([x, y]);
  }
  return list;
}
const TREES = genTrees();

// Collision obstacles
const OBST = [
  { t: "rect", x: 0, y: 0, w: 165, h: 150 },
  { t: "rect", x: FALL.x0, y: FALL.y0, w: FALL.x1 - FALL.x0, h: FALL.y1 - FALL.y0 },
  { t: "ell", cx: LAKE.cx, cy: LAKE.cy, rx: LAKE.rx, ry: LAKE.ry },
  { t: "rect", x: BARN.x, y: BARN.y + 30, w: BARN.w, h: BARN.h - 30 }
];
TREES.forEach(([x, y]) => OBST.push({ t: "circ", x, y, r: 12 }));

function blocked(x, y) {
  for (const o of OBST) {
    if (o.t === "rect") {
      if (x > o.x - R && x < o.x + o.w + R && y > o.y - R && y < o.y + o.h + R) return true;
    } else if (o.t === "ell") {
      const a = (x - o.cx) / (o.rx + R), b = (y - o.cy) / (o.ry + R);
      if (a * a + b * b < 1) return true;
    } else {
      const dx = x - o.x, dy = y - o.y, rr = o.r + R;
      if (dx * dx + dy * dy < rr * rr) return true;
    }
  }
  return x < R || y < R || x > W - R || y > H - R;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function snapCell(v) { return Math.round(v / CELL) * CELL; }

// ---------- Textures (fallback drawn if a file is missing) ----------
const soilImg = new Image();
let soilReady = false;
soilImg.onload = () => { soilReady = true; };
soilImg.src = "textures/soil_tile.png";

const wheatImg = new Image();
let wheatReady = false;
wheatImg.onload = () => { wheatReady = true; };
wheatImg.src = "textures/wheat_tile.png";

const barnImg = new Image();
let barnReady = false;
barnImg.onload = () => { barnReady = true; };
barnImg.src = "textures/barn.png";

// ---------- Drawing helpers ----------
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
  g.fill();
}
function strokeSmooth(g, pts, width, color) {
  g.strokeStyle = color;
  g.lineWidth = width;
  g.lineCap = "round";
  g.lineJoin = "round";
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2;
    const my = (pts[i][1] + pts[i + 1][1]) / 2;
    g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const l = pts[pts.length - 1];
  g.lineTo(l[0], l[1]);
  g.stroke();
}

// Static background (built once)
function buildBackground() {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  const rnd = rng(42);

  const gg = g.createLinearGradient(0, 0, 0, H);
  gg.addColorStop(0, "#a5d86b");
  gg.addColorStop(1, "#6fae3c");
  g.fillStyle = gg;
  g.fillRect(0, 0, W, H);

  for (let i = 0; i < 90; i++) {
    g.fillStyle = "rgba(255,255,200,.06)";
    g.beginPath();
    g.ellipse(rnd() * W, rnd() * H, 40 + rnd() * 60, 20 + rnd() * 30, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.strokeStyle = "rgba(50,100,25,.28)";
  g.lineWidth = 1.3;
  g.lineCap = "round";
  for (let i = 0; i < 3000; i++) {
    const x = rnd() * W, y = rnd() * H;
    g.beginPath();
    g.moveTo(x, y); g.lineTo(x - 1.5, y - 4);
    g.moveTo(x, y); g.lineTo(x + 1.5, y - 4.5);
    g.stroke();
  }

  strokeSmooth(g, PATH, 58, "#a9794a");
  strokeSmooth(g, PATH, 46, "#c99a60");

  const flowers = ["#fff176", "#f48fb1", "#ffffff", "#ce93d8", "#ffab91"];
  for (let i = 0; i < 400; i++) {
    const x = rnd() * W, y = rnd() * H;
    if (blocked(x, y)) continue;
    if (PATH_PTS.some(([px, py]) => Math.hypot(px - x, py - y) < 30)) continue;
    g.fillStyle = flowers[i % flowers.length];
    circ(g, x, y, 2.2);
  }

  [[70, 560, 14], [200, 560, 11], [250, 470, 10], [40, 420, 9], [210, 405, 8]].forEach(([x, y, r]) => {
    g.fillStyle = "#8a8f96";
    g.beginPath(); g.ellipse(x, y, r, r * 0.75, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,.25)";
    g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.3, r * 0.4, r * 0.25, 0, 0, Math.PI * 2); g.fill();
  });

  const cg = g.createLinearGradient(0, 0, 0, 150);
  cg.addColorStop(0, "#6d6259");
  cg.addColorStop(1, "#8b7d70");
  g.fillStyle = cg;
  g.fillRect(0, 0, 165, 150);
  g.fillStyle = "rgba(0,0,0,.18)";
  for (let i = 0; i < 14; i++) {
    g.beginPath();
    g.ellipse(rnd() * 165, rnd() * 150, 8 + rnd() * 12, 5 + rnd() * 8, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.fillStyle = "#4f463f";
  g.fillRect(0, 140, 165, 10);

  const lg = g.createRadialGradient(100, 465, 20, LAKE.cx, LAKE.cy, 130);
  lg.addColorStop(0, "#4fc3f7");
  lg.addColorStop(1, "#0277bd");
  g.fillStyle = lg;
  g.beginPath(); g.ellipse(LAKE.cx, LAKE.cy, LAKE.rx, LAKE.ry, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,.85)";
  g.lineWidth = 3;
  g.beginPath(); g.ellipse(LAKE.cx, LAKE.cy, LAKE.rx + 1, LAKE.ry + 1, 0, 0, Math.PI * 2); g.stroke();

  TREES.forEach(([x, y]) => {
    g.fillStyle = "rgba(0,0,0,.2)";
    g.beginPath(); g.ellipse(x, y + 2, 18, 7, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#6b4a2b";
    g.fillRect(x - 3, y - 14, 6, 16);
    g.fillStyle = "#2e7d32"; circ(g, x, y - 26, 18);
    g.fillStyle = "#43a047"; circ(g, x - 4, y - 30, 11);
    g.fillStyle = "#66bb6a"; circ(g, x - 7, y - 34, 5);
  });

  return c;
}

function drawWaterfall(g, t) {
  const { x0, x1, y0, y1 } = FALL;
  const wg = g.createLinearGradient(x0, 0, x1, 0);
  wg.addColorStop(0, "#cfefff");
  wg.addColorStop(0.5, "#ffffff");
  wg.addColorStop(1, "#9fd8f5");
  g.fillStyle = wg;
  g.fillRect(x0, y0, x1 - x0, y1 - y0);

  g.strokeStyle = "rgba(255,255,255,.85)";
  g.lineWidth = 2.2;
  g.lineCap = "round";
  for (let i = 0; i < 7; i++) {
    const x = x0 + 6 + i * 8;
    const off = (t * 180 + i * 41) % (y1 - y0);
    const len = 18 + (i % 3) * 6;
    g.beginPath();
    g.moveTo(x, y0 + off);
    g.lineTo(x, y0 + off + len);
    g.stroke();
  }

  const p = (Math.sin(t * 5) + 1) / 2;
  g.fillStyle = "rgba(255,255,255,.7)";
  g.beginPath(); g.ellipse(93, 404, 26 + p * 6, 8 + p * 2, 0, 0, Math.PI * 2); g.fill();

  g.save();
  g.beginPath();
  g.ellipse(LAKE.cx, LAKE.cy, LAKE.rx, LAKE.ry, 0, 0, Math.PI * 2);
  g.clip();
  for (let i = 0; i < 3; i++) {
    const k = (t * 0.5 + i / 3) % 1;
    g.strokeStyle = `rgba(255,255,255,${(1 - k) * 0.7})`;
    g.lineWidth = 1.8;
    g.beginPath();
    g.ellipse(93, 406, 12 + k * 70, 5 + k * 22, 0, 0, Math.PI * 2);
    g.stroke();
  }
  g.fillStyle = "rgba(255,255,255,.35)";
  for (let i = 0; i < 5; i++) {
    const sx = 40 + ((i * 97 + t * 20) % 160);
    const sy = 430 + ((i * 23) % 90);
    g.fillRect(sx, sy, 10, 1.5);
  }
  g.restore();
}

// Barn: uses textures/barn.png, or a simple drawn barn if the file is missing
function drawBarn(g) {
  const { x, y, w, h } = BARN;
  g.fillStyle = "rgba(0,0,0,.2)";
  g.beginPath(); g.ellipse(x + w / 2, y + h + 2, w / 2 + 4, 6, 0, 0, Math.PI * 2); g.fill();
  if (barnReady) {
    g.drawImage(barnImg, x, y, w, h);
    return;
  }
  g.fillStyle = "#b5483a";
  g.fillRect(x + 10, y + 40, w - 20, h - 40);
  g.fillStyle = "#5d2e22";
  g.beginPath();
  g.moveTo(x, y + 44); g.lineTo(x + w / 2, y + 4); g.lineTo(x + w, y + 44);
  g.closePath(); g.fill();
  g.fillStyle = "#f5f0e6";
  g.fillRect(x + w / 2 - 14, y + 62, 28, h - 62);
}

// Soil cell
function drawCell(g, c, selected, now) {
  const x = c.x, y = c.y, s = CELL;
  if (soilReady) {
    g.drawImage(soilImg, x, y, s, s);
  } else {
    g.fillStyle = "#8d6a46";
    g.fillRect(x, y, s, s);
  }
  if (c.crop) drawWheat(g, c, now, selected);
  if (selected) {
    g.strokeStyle = "#ffeb3b";
    g.lineWidth = 3;
    g.setLineDash([6, 4]);
    g.strokeRect(x - 2, y - 2, s + 4, s + 4);
    g.setLineDash([]);
  }
}

function cropProgress(c, now) {
  if (!c.crop) return 0;
  return clamp((now - c.crop.t) / GROW_MS, 0, 1);
}

function drawWheat(g, c, now, selected) {
  const p = cropProgress(c, now);
  const x = c.x, y = c.y, s = CELL;

  if (p >= 1 && wheatReady) {
    g.drawImage(wheatImg, x, y, s, s);
  } else {
    const cols = 6;
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < 2; j++) {
        const bx = x + 8 + i * ((s - 16) / (cols - 1));
        const base = y + s - 8 - j * 8;
        const hgt = 4 + p * 26;
        g.strokeStyle = p < 0.5 ? "#7cb342" : (p < 1 ? "#c0ca33" : "#f9a825");
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(bx, base);
        g.lineTo(bx + (j ? 1 : -1), base - hgt);
        g.stroke();
        if (p >= 1) {
          g.fillStyle = "#fbc02d";
          circ(g, bx + (j ? 1 : -1), base - hgt - 2, 2.2);
        }
      }
    }
  }

  // progress bar along the bottom of the cell (small, no overlapping text)
  g.fillStyle = "rgba(0,0,0,.35)";
  g.fillRect(x + 4, y + s - 6, s - 8, 3);
  g.fillStyle = p >= 1 ? "#ffb300" : "#9ccc65";
  g.fillRect(x + 4, y + s - 6, (s - 8) * p, 3);

  // full text label only for the selected cell
  if (selected) {
    const label = p >= 1 ? "Yeti\u015Fdi!" : `B\u00F6y\u00FCy\u00FCr ${Math.ceil((1 - p) * GROW_MS / 1000)} s`;
    g.font = "bold 9px system-ui, sans-serif";
    const w = g.measureText(label).width + 10;
    g.fillStyle = p >= 1 ? "rgba(255,160,0,.9)" : "rgba(0,0,0,.6)";
    rr(g, x + s / 2 - w / 2, y - 16, w, 12, 5);
    g.fillStyle = "#ffffff";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(label, x + s / 2, y - 10);
  }
}

// Character drawn with code
function drawChar(g, p, t, label) {
  const x = p.x, f = p.f || 1, moving = !!p.m;
  const isBoy = p.role === "boy";
  const ph = t * 11;
  const bob = moving ? Math.abs(Math.sin(ph)) * 1.8 : Math.sin(t * 2) * 0.5;
  const sw = moving ? Math.sin(ph) * 3 : 0;
  const cy = p.y - bob;

  g.fillStyle = "rgba(0,0,0,.22)";
  g.beginPath(); g.ellipse(x, p.y + 9, 9, 3.5, 0, 0, Math.PI * 2); g.fill();

  g.fillStyle = isBoy ? "#33334d" : "#5a4a7a";
  rr(g, x - 5.5 + sw, cy + 3, 4.5, 9, 2);
  rr(g, x + 1 - sw, cy + 3, 4.5, 9, 2);
  g.fillStyle = "#3a2418";
  rr(g, x - 6 + sw, cy + 10.5, 5.5, 2.5, 1.2);
  rr(g, x + 0.5 - sw, cy + 10.5, 5.5, 2.5, 1.2);

  g.fillStyle = "#f6cba0";
  const aw = isBoy ? 10.5 : 9;
  circ(g, x - aw, cy - 1 - sw * 0.6, 2.8);
  circ(g, x + aw, cy - 1 + sw * 0.6, 2.8);

  if (isBoy) {
    g.fillStyle = CHARS.boy.color;
    rr(g, x - 9, cy - 6, 18, 12, 4);
    g.fillStyle = "#5a3a1e";
    rr(g, x - 9, cy + 2, 18, 2, 1);
  } else {
    g.fillStyle = CHARS.girl.color;
    g.beginPath();
    g.moveTo(x - 6, cy - 6);
    g.lineTo(x + 6, cy - 6);
    g.lineTo(x + 11, cy + 8);
    g.lineTo(x - 11, cy + 8);
    g.closePath();
    g.fill();
    rr(g, x - 6, cy - 6, 12, 7, 3);
  }

  const hy = cy - 16;

  if (!isBoy) {
    g.fillStyle = "#7a3e1d";
    g.beginPath(); g.ellipse(x, hy + 4, 11, 12, 0, 0, Math.PI * 2); g.fill();
  }

  g.fillStyle = "#f6cba0";
  circ(g, x, hy, 9.5);

  if (isBoy) {
    g.fillStyle = "#3a2412";
    g.beginPath(); g.ellipse(x - f * 4, hy + 2, 3.5, 3, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#d32f2f";
    g.beginPath(); g.arc(x, hy - 1, 10, Math.PI * 1.0, Math.PI * 2.0); g.closePath(); g.fill();
    g.fillStyle = "#b71c1c";
    g.beginPath(); g.ellipse(x + f * 5, hy - 2, 6.5, 2, 0, 0, Math.PI * 2); g.fill();
  } else {
    g.fillStyle = "#7a3e1d";
    g.beginPath(); g.arc(x, hy, 10, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(x + f, hy - 6, 9, 4, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ff6fa8";
    circ(g, x - f * 8, hy - 7, 2.6);
  }

  const blink = (t % 3.2) < 0.12;
  const ox = f * 1.2;
  g.fillStyle = "#1e1e1e";
  if (blink) {
    g.fillRect(x - 4.2 + ox, hy + 0.5, 2.4, 0.8);
    g.fillRect(x + 1.8 + ox, hy + 0.5, 2.4, 0.8);
  } else {
    circ(g, x - 3 + ox, hy + 1, 1.5);
    circ(g, x + 3 + ox, hy + 1, 1.5);
    g.fillStyle = "#ffffff";
    circ(g, x - 2.5 + ox, hy + 0.4, 0.5);
    circ(g, x + 3.5 + ox, hy + 0.4, 0.5);
  }

  g.fillStyle = "rgba(255,120,140,.45)";
  circ(g, x - 5.5, hy + 4, 1.8);
  circ(g, x + 5.5, hy + 4, 1.8);
  g.strokeStyle = "#8a4a3a";
  g.lineWidth = 0.8;
  g.beginPath(); g.arc(x + ox * 0.8, hy + 4, 1.8, 0.2, Math.PI - 0.2); g.stroke();

  if (label) {
    g.font = "bold 9px system-ui, sans-serif";
    const w = g.measureText(label).width + 8;
    g.fillStyle = "rgba(0,0,0,.55)";
    rr(g, x - w / 2, hy - 24, w, 11, 4);
    g.fillStyle = "#ffffff";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(label, x, hy - 18.5);
  }
}

// ---------- App ----------
const statusEl  = document.getElementById("status");
const selectEl  = document.getElementById("select");
const gameEl    = document.getElementById("game");
const infoEl    = document.getElementById("info");
const canvas    = document.getElementById("world");
const joyEl     = document.getElementById("joy");
const knobEl    = document.getElementById("knob");
const buttons   = document.querySelectorAll(".choice");
const coinsEl   = document.getElementById("coins");
const openBtn   = document.getElementById("openShop");
const shopModal = document.getElementById("shopModal");
const closeBtn  = document.getElementById("closeShop");
const coinsModal= document.getElementById("coinsModal");
const seedCount = document.getElementById("seedCount");
const buySoilBtn= document.getElementById("buy-soil");
const buySeedBtn= document.getElementById("buy-seed");
const delBtn    = document.getElementById("del-plot");
const toastEl   = document.getElementById("toast");
const barnModal = document.getElementById("barnModal");
const closeBarn = document.getElementById("closeBarn");
const barFill   = document.getElementById("barFill");
const barText   = document.getElementById("barText");
const barWheat  = document.getElementById("barWheat");

const configured = !firebaseConfig.apiKey.startsWith("YOUR_");

if (!configured) {
  statusEl.textContent = "Firebase konfigurasiyas\u0131 doldurulmay\u0131b.";
  buttons.forEach(b => b.disabled = true);
} else {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const roomRef = db.ref(`rooms/${ROOM_ID}`);
  const playersRef = roomRef.child("players");
  const cellsRef = roomRef.child("cells");
  const warehouseRef = roomRef.child("warehouse/wheat");
  const g = canvas.getContext("2d");
  const bgCanvas = buildBackground();

  let serverOffset = 0;
  db.ref(".info/serverTimeOffset").on("value", s => { serverOffset = s.val() || 0; });
  const serverNow = () => Date.now() + serverOffset;

  let me = null;
  let players = {};
  const remote = {};
  const seenA = {};
  let joining = false;
  let loopStarted = false;
  let statusMsg = "";
  let lastSent = 0, lastKey = "";
  let t = 0, lastFrame = performance.now();

  let cells = {};
  let selectedId = null;
  let drag = null;
  let coins = START_COINS;
  let seeds = 0;
  let wheatStock = 0;
  let lastCam = { x: 0, y: 0, s: 1 };

  // ----- Input: keyboard -----
  const keysDown = new Set();
  const KEYS = {
    w: [0, -1], arrowup: [0, -1],
    s: [0, 1],  arrowdown: [0, 1],
    a: [-1, 0], arrowleft: [-1, 0],
    d: [1, 0],  arrowright: [1, 0]
  };
  function anyModalOpen() {
    return shopModal.classList.contains("open") || barnModal.classList.contains("open");
  }
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (KEYS[k] && !anyModalOpen()) { e.preventDefault(); keysDown.add(k); }
  });
  document.addEventListener("keyup", e => keysDown.delete(e.key.toLowerCase()));
  window.addEventListener("blur", () => { keysDown.clear(); joy = { x: 0, y: 0 }; });

  // ----- Input: joystick -----
  let joy = { x: 0, y: 0 };
  function setJoy(e) {
    const r = joyEl.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const max = r.width / 2 - 26;
    const d = Math.hypot(dx, dy) || 1;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    const mag = Math.min(1, Math.hypot(dx, dy) / max);
    const len = Math.hypot(dx, dy) || 1;
    joy = mag < 0.15 ? { x: 0, y: 0 } : { x: (dx / len) * mag, y: (dy / len) * mag };
  }
  joyEl.addEventListener("pointerdown", e => {
    if (!me) return;
    joyEl.setPointerCapture(e.pointerId);
    setJoy(e);
  });
  joyEl.addEventListener("pointermove", e => {
    if (joyEl.hasPointerCapture(e.pointerId)) setJoy(e);
  });
  function releaseJoy() {
    joy = { x: 0, y: 0 };
    knobEl.style.transform = "translate(-50%, -50%)";
  }
  joyEl.addEventListener("pointerup", releaseJoy);
  joyEl.addEventListener("pointercancel", releaseJoy);

  function inputVec() {
    let x = 0, y = 0;
    keysDown.forEach(k => { x += KEYS[k][0]; y += KEYS[k][1]; });
    if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
    return joy;
  }

  // ----- Availability -----
  function isStale(role) {
    const s = seenA[role];
    return !s || Date.now() - s.at > IDLE_MS;
  }
  function isAlive(role) {
    return !!players[role] && !isStale(role);
  }

  // ----- Sync: players -----
  playersRef.on("value", snap => {
    const data = snap.val() || {};
    const now = Date.now();
    players = data;
    for (const role of Object.keys(data)) {
      const p = data[role];
      if (!seenA[role] || seenA[role].a !== p.a) seenA[role] = { a: p.a, at: now };
    }
    for (const role of Object.keys(seenA)) if (!data[role]) delete seenA[role];
    syncRemote();
    updateInfo();
    refreshButtons();
  });

  function syncRemote() {
    for (const role of Object.keys(remote)) {
      if (!isAlive(role) || (me && role === me.role)) delete remote[role];
    }
    for (const role of Object.keys(players)) {
      if (me && role === me.role) continue;
      if (!isAlive(role)) continue;
      const p = players[role];
      if (!remote[role]) remote[role] = { x: p.x, y: p.y };
      Object.assign(remote[role], { role, tx: p.x, ty: p.y, f: p.f || 1, m: !!p.m, name: p.name });
    }
  }

  // ----- Sync: soil cells -----
  cellsRef.on("value", snap => {
    cells = snap.val() || {};
    if (selectedId && !cells[selectedId]) selectedId = null;
    updateShop();
  });

  roomRef.child("meta/cellsStarter").transaction(cur => {
    if (cur) return;
    return true;
  }).then(res => {
    if (res.committed && res.snapshot.val() === true) {
      cellsRef.child("start").set({ x: 704, y: 448, w: CELL, h: CELL });
    }
  });

  // ----- Sync: warehouse -----
  warehouseRef.on("value", snap => {
    wheatStock = snap.val() || 0;
    updateBarn();
  });

  // ----- Cell helpers -----
  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function overlapsAny(rect, exceptId) {
    for (const k in cells) {
      if (k === exceptId) continue;
      if (overlaps(rect, cells[k])) return true;
    }
    return false;
  }
  function cellFree(rect, exceptId) {
    if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > W || rect.y + rect.h > H) return false;
    if (overlapsAny(rect, exceptId)) return false;
    const pts = [[rect.x, rect.y], [rect.x + rect.w, rect.y], [rect.x, rect.y + rect.h],
                 [rect.x + rect.w, rect.y + rect.h], [rect.x + rect.w / 2, rect.y + rect.h / 2]];
    return !pts.some(([qx, qy]) => blocked(qx, qy));
  }
  function hitCell(wx, wy) {
    const ids = Object.keys(cells).reverse();
    for (const id of ids) {
      const c = (drag && drag.id === id) ? { x: drag.x, y: drag.y } : cells[id];
      if (wx >= c.x && wx <= c.x + CELL && wy >= c.y && wy <= c.y + CELL) return id;
    }
    return null;
  }
  function hitBarn(wx, wy) {
    const m = 6;
    return wx >= BARN.x - m && wx <= BARN.x + BARN.w + m && wy >= BARN.y - m && wy <= BARN.y + BARN.h + m;
  }
  function findFreeCell(cx, cy) {
    const bx = snapCell(cx - CELL / 2), by = snapCell(cy - CELL / 2);
    for (let ring = 0; ring < 12; ring++) {
      for (let dy = -ring; dy <= ring; dy++) {
        for (let dx = -ring; dx <= ring; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
          const rect = { x: bx + dx * CELL, y: by + dy * CELL, w: CELL, h: CELL };
          if (cellFree(rect, null)) return rect;
        }
      }
    }
    return null;
  }

  // ----- Toast -----
  function showToast(text) {
    toastEl.textContent = text;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { toastEl.textContent = ""; }, 3000);
  }

  // ----- Shop modal -----
  function openShop() { shopModal.classList.add("open"); updateShop(); }
  function closeShop() { shopModal.classList.remove("open"); }
  openBtn.addEventListener("click", openShop);
  closeBtn.addEventListener("click", closeShop);
  shopModal.addEventListener("click", e => { if (e.target === shopModal) closeShop(); });

  function updateShop() {
    coinsEl.textContent = `Pul: ${coins}`;
    coinsModal.textContent = `Pul: ${coins}`;
    seedCount.textContent = seeds;
    delBtn.disabled = !(selectedId && cells[selectedId]);
    buySoilBtn.disabled = !me;
    buySeedBtn.disabled = !me;
  }

  // ----- Barn modal (shows capacity only when the barn is tapped) -----
  function openBarn() { barnModal.classList.add("open"); updateBarn(); }
  function closeBarnModal() { barnModal.classList.remove("open"); }
  closeBarn.addEventListener("click", closeBarnModal);
  barnModal.addEventListener("click", e => { if (e.target === barnModal) closeBarnModal(); });

  function updateBarn() {
    const used = wheatStock;
    const free = Math.max(0, WAREHOUSE_CAP - used);
    const pct = Math.min(100, (used / WAREHOUSE_CAP) * 100);
    barFill.style.width = pct + "%";
    barText.textContent = `Tutum: ${WAREHOUSE_CAP}  \u00B7  \u0130stifad\u0259 olunub: ${used}  \u00B7  Bo\u015F yer: ${free}`;
    barWheat.textContent = used;
  }

  buySoilBtn.addEventListener("click", () => {
    if (!me) return;
    if (coins < SOIL.price) { showToast("Pulunuz \u00E7atm\u0131r."); return; }
    const spot = findFreeCell(me.x, me.y - 60);
    if (!spot) { showToast("Yerl\u0259\u015Fdirm\u0259k \u00FC\u00E7\u00FCn yer tap\u0131lmad\u0131."); return; }
    coins -= SOIL.price;
    const ref = cellsRef.push(spot);
    selectedId = ref.key;
    updateShop();
    showToast("Torpaq al\u0131nd\u0131. Yeni sah\u0259 \u0259lav\u0259 olundu.");
  });

  buySeedBtn.addEventListener("click", () => {
    if (!me) return;
    if (coins < SEED_PRICE) { showToast("Pulunuz \u00E7atm\u0131r."); return; }
    coins -= SEED_PRICE;
    seeds += 1;
    updateShop();
    showToast("Bu\u011Fda toxumu al\u0131nd\u0131.");
  });

  delBtn.addEventListener("click", () => {
    if (!selectedId) return;
    cellsRef.child(selectedId).remove();
    coins += SOIL.refund;
    selectedId = null;
    updateShop();
  });

  // ----- Tap actions on a cell -----
  function handleTap(id) {
    const c = cells[id];
    if (!c) return;
    if (c.crop) {
      const p = cropProgress(c, serverNow());
      if (p < 1) {
        showToast(`B\u00F6y\u00FCy\u00FCr... ${Math.ceil((1 - p) * GROW_MS / 1000)} s`);
        return;
      }
      // harvest: move wheat into the warehouse only if there is room
      warehouseRef.transaction(n => {
        n = n || 0;
        if (n + WHEAT_YIELD > WAREHOUSE_CAP) return;   // abort: no room
        return n + WHEAT_YIELD;
      }).then(res => {
        if (res.committed) {
          cellsRef.child(id).child("crop").remove();
          const left = WAREHOUSE_CAP - res.snapshot.val();
          showToast(`M\u0259hsul ambara \u0259lav\u0259 olundu: +${WHEAT_YIELD}. Ambarda ${left} yer qald\u0131.`);
        } else {
          showToast("Ambarda yer yoxdur. \u018Fvv\u0259l ambar\u0131 bo\u015Faldın.");
        }
      });
      return;
    }
    if (seeds > 0) {
      seeds -= 1;
      cellsRef.child(id).update({ crop: { k: "wheat", t: serverNow() } });
      showToast("Toxum \u0259kildi.");
      updateShop();
    } else {
      showToast("Toxum yoxdur, ma\u011Fazadan al\u0131n.");
    }
  }

  // ----- Canvas pointer: select, drag (grid snapped), tap, barn -----
  function toWorld(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left - canvas.clientLeft;
    const py = e.clientY - rect.top - canvas.clientTop;
    return { x: px / lastCam.s + lastCam.x, y: py / lastCam.s + lastCam.y };
  }

  canvas.addEventListener("pointerdown", e => {
    if (!me) return;
    const p = toWorld(e);
    const id = hitCell(p.x, p.y);
    if (id) {
      selectedId = id;
      const c = cells[id];
      drag = { id, ox: p.x - c.x, oy: p.y - c.y, x: c.x, y: c.y, sx: p.x, sy: p.y, moved: false, lastSent: 0 };
      canvas.setPointerCapture(e.pointerId);
    } else if (hitBarn(p.x, p.y)) {
      selectedId = null;
      openBarn();
    } else {
      selectedId = null;
    }
    updateShop();
  });

  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const c = cells[drag.id];
    if (!c) { drag = null; return; }
    const p = toWorld(e);
    if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 6) drag.moved = true;
    if (!drag.moved) return;

    const cand = { x: snapCell(p.x - drag.ox), y: snapCell(p.y - drag.oy), w: CELL, h: CELL };
    if (cellFree(cand, drag.id)) {
      drag.x = cand.x;
      drag.y = cand.y;
    }
    const now = performance.now();
    if (now - drag.lastSent > SEND_MS) {
      drag.lastSent = now;
      cellsRef.child(drag.id).update({ x: drag.x, y: drag.y });
    }
  });

  function endDrag() {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (!d.moved) { handleTap(d.id); return; }
    cellsRef.child(d.id).update({ x: d.x, y: d.y });
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // ----- Own presence -----
  function sendState(now) {
    const key = `${me.x.toFixed(1)}|${me.y.toFixed(1)}|${me.f}|${me.m}`;
    if (key === lastKey) return;
    if (me.m && now - lastSent < SEND_MS) return;
    lastKey = key;
    lastSent = now;
    playersRef.child(me.role).update({
      x: +me.x.toFixed(1), y: +me.y.toFixed(1), f: me.f, m: me.m, a: Date.now()
    });
  }

  // ----- Selection screen -----
  function refreshButtons() {
    if (me || joining) return;
    buttons.forEach(b => { b.disabled = isAlive(b.dataset.role); });
    statusEl.textContent = statusMsg || "Karakter se\u00E7in";
  }

  setInterval(() => {
    const now = Date.now();
    for (const role of Object.keys(players)) {
      if (me && role === me.role) continue;
      if (isStale(role)) playersRef.child(role).remove();
    }
    if (me && now - me.lastAct > IDLE_MS) {
      kickSelf("20 saniy\u0259 h\u0259r\u0259k\u0259t olmad\u0131\u011F\u0131 \u00FC\u00E7\u00FCn oyundan \u00E7\u0131xar\u0131ld\u0131n.");
    }
    syncRemote();
    refreshButtons();
  }, 1000);

  function kickSelf(msg) {
    if (!me) return;
    const role = me.role;
    playersRef.child(role).onDisconnect().cancel();
    playersRef.child(role).remove();
    me = null;
    lastKey = "";
    drag = null;
    selectedId = null;
    closeShop();
    closeBarnModal();
    Object.keys(remote).forEach(k => delete remote[k]);
    statusMsg = msg;
    gameEl.style.display = "none";
    selectEl.style.display = "flex";
    refreshButtons();
  }

  // ----- Joining -----
  buttons.forEach(btn => btn.addEventListener("click", () => joinAs(btn.dataset.role)));

  async function joinAs(role) {
    if (isAlive(role)) {
      statusMsg = "Bu karakter art\u0131q tutulub. Dig\u0259rini se\u00E7in.";
      statusEl.textContent = statusMsg;
      return;
    }
    joining = true;
    buttons.forEach(b => b.disabled = true);
    statusMsg = "Qo\u015Fulur...";
    statusEl.textContent = statusMsg;

    const slotRef = playersRef.child(role);
    const start = CHARS[role].start;
    const result = await slotRef.transaction(current => {
      if (current) return;
      return { name: CHARS[role].name, x: start.x, y: start.y, f: 1, m: false, a: Date.now() };
    });
    joining = false;

    if (!result.committed) {
      statusMsg = "Bu karakter art\u0131q tutulub. Dig\u0259rini se\u00E7in.";
      refreshButtons();
      return;
    }

    me = { role, x: start.x, y: start.y, f: 1, m: false, lastAct: Date.now() };
    lastKey = "";
    statusMsg = "";
    slotRef.onDisconnect().remove();

    selectEl.style.display = "none";
    gameEl.style.display = "flex";
    resizeCanvas();
    syncRemote();
    updateInfo();
    updateShop();
    if (!loopStarted) {
      loopStarted = true;
      lastFrame = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function updateInfo() {
    if (!me) return;
    const other = me.role === "boy" ? "girl" : "boy";
    const waiting = !isAlive(other);
    infoEl.textContent = `S\u0259n: ${CHARS[me.role].name}` +
      (waiting ? " \u2014 dig\u0259r oyun\u00E7u g\u00F6zl\u0259nilir..." : "");
  }

  // ----- Canvas sizing -----
  function resizeCanvas() {
    const cw = Math.max(220, Math.min(window.innerWidth - 24, 760));
    const ch = Math.round(Math.min(cw * 0.66, window.innerHeight * 0.6));
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
    gameEl.style.width = cw + "px";
  }
  window.addEventListener("resize", resizeCanvas);

  // ----- Game loop -----
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    t += dt;

    if (me) {
      const d = inputVec();
      me.m = !!(d.x || d.y);
      if (me.m) {
        me.lastAct = Date.now();
        const nx = me.x + d.x * SPEED * dt;
        const ny = me.y + d.y * SPEED * dt;
        if (!blocked(nx, me.y)) me.x = nx;
        if (!blocked(me.x, ny)) me.y = ny;
        if (Math.abs(d.x) > 0.2) me.f = d.x < 0 ? -1 : 1;
      }
      sendState(now);
    }

    for (const k in remote) {
      const r = remote[k];
      const a = Math.min(1, dt * 12);
      r.x += (r.tx - r.x) * a;
      r.y += (r.ty - r.y) * a;
    }

    if (me) render(t);
    requestAnimationFrame(loop);
  }

  function render(time) {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }

    const s = cw / VW;
    const vh = ch / s;
    const camX = clamp(me.x - VW / 2, 0, W - VW);
    const camY = clamp(me.y - vh / 2, 0, H - vh);
    lastCam = { x: camX, y: camY, s };

    g.setTransform(dpr * s, 0, 0, dpr * s, -camX * dpr * s, -camY * dpr * s);
    g.fillStyle = "#6fae3c";
    g.fillRect(camX, camY, VW, vh);
    g.drawImage(bgCanvas, 0, 0, W, H);
    drawWaterfall(g, time);

    const now = serverNow();
    for (const id in cells) {
      const c = (drag && drag.id === id) ? { x: drag.x, y: drag.y, crop: cells[id].crop } : cells[id];
      drawCell(g, c, id === selectedId, now);
    }

    // barn is drawn among the other things, sorted by its bottom edge
    const things = [];
    things.push({ y: BARN.y + BARN.h, draw: () => drawBarn(g) });
    const list = [{ role: me.role, x: me.x, y: me.y, f: me.f, m: me.m, label: "S\u0259n" }];
    for (const k in remote) {
      const r = remote[k];
      list.push({ role: k, x: r.x, y: r.y, f: r.f, m: r.m, label: r.name });
    }
    list.forEach(p => things.push({ y: p.y, draw: () => drawChar(g, p, time, p.label) }));
    things.sort((a, b) => a.y - b.y);
    things.forEach(th => th.draw());
  }
}
</script>
