<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fermer Oyunu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(#8fd3f4, #cdeffd);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
    user-select: none;
  }
  #select {
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    background: #fff; padding: 24px; border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.2); width: min(90vw, 340px);
  }
  #select h1 { font-size: 1.4rem; text-align: center; }
  .choice {
    width: 100%; font-size: 1.2rem; padding: 14px; border: none; border-radius: 12px;
    background: #4caf50; color: #fff; cursor: pointer;
  }
  .choice:disabled { background: #aaa; cursor: not-allowed; }
  #status { font-size: .95rem; color: #333; text-align: center; min-height: 1.2em; }

  #game { display: none; flex-direction: column; align-items: center; gap: 8px; }
  #info { color: #fff; font-weight: bold; text-shadow: 0 1px 3px #000; text-align: center; min-height: 1.2em; }
  #map {
    position: relative;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    width: min(95vw, 420px);
    aspect-ratio: 1;
    border: 4px solid #5d4037;
    border-radius: 8px;
    overflow: hidden;
    background: #7cb342;
  }
  .tile { background: #8bc34a; border: 1px solid #689f38; cursor: pointer; }
  .tile:active { filter: brightness(1.1); }
  .player {
    position: absolute;
    width: 10%;
    height: 10%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(16px, 4.5vw, 26px);
    transition: left .25s ease, top .25s ease;
    pointer-events: none;
    z-index: 2;
  }
  .player .tag {
    position: absolute; top: -14px; font-size: 10px; background: rgba(0,0,0,.6);
    color: #fff; padding: 1px 4px; border-radius: 4px; white-space: nowrap;
  }
</style>
</head>
<body>

<div id="select">
  <h1>Karakterini seç</h1>
  <button class="choice" id="btn-boy" data-role="boy">👦 Oğlan</button>
  <button class="choice" id="btn-girl" data-role="girl">👧 Qız</button>
  <div id="status">Yüklənir...</div>
</div>

<div id="game">
  <div id="info"></div>
  <div id="map"></div>
</div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   1) BURANI DOLDURUN: Firebase konfiqurasiyası
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCWli-LygY7f2KoPgCVpWpb2PsnlLWNFwM",
  authDomain: "wevillage-1102.firebaseapp.com",
  databaseURL: "https://wevillage-1102-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wevillage-1102",
  storageBucket: "wevillage-1102.firebasestorage.app",
  messagingSenderId: "790485485366",
  appId: "1:790485485366:web:8b4ead34a2208620601597"
};

/* ============================================================ */

const SIZE = 10;
const ROOM = "main";
const CHARS = {
  boy:  { emoji: "👦", name: "Oğlan", start: { x: 1, y: 1 } },
  girl: { emoji: "👧", name: "Qız",  start: { x: 8, y: 8 } }
};

const statusEl = document.getElementById("status");
const selectEl = document.getElementById("select");
const gameEl   = document.getElementById("game");
const infoEl   = document.getElementById("info");
const mapEl    = document.getElementById("map");
const buttons  = document.querySelectorAll(".choice");

const configured = !firebaseConfig.apiKey.startsWith("YOUR_");

if (!configured) {
  statusEl.textContent = "Firebase konfiqurasiyası doldurulmayıb (index.html-də firebaseConfig).";
  buttons.forEach(b => b.disabled = true);
} else {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const playersRef = db.ref(`rooms/${ROOM}/players`);

  let myRole = null;
  let players = {};
  const playerEls = {};

  // Xəritə xanaları
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.addEventListener("click", () => moveTo(x, y));
      mapEl.appendChild(tile);
    }
  }

  // Oyunçu seçimi
  buttons.forEach(btn => {
    btn.addEventListener("click", () => joinAs(btn.dataset.role));
  });

  async function joinAs(role) {
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = "Qoşulur...";

    const slotRef = playersRef.child(role);
    const result = await slotRef.transaction(current => {
      if (current) return; // artıq tutulub, abort
      return {
        name: CHARS[role].name,
        emoji: CHARS[role].emoji,
        x: CHARS[role].start.x,
        y: CHARS[role].start.y
      };
    });

    if (!result.committed) {
      statusEl.textContent = "Bu karakter artıq tutulub. Digərini seçin.";
      buttons.forEach(b => {
        if (b.dataset.role !== role) b.disabled = false;
      });
      return;
    }

    myRole = role;
    slotRef.onDisconnect().remove(); // telefon bağlananda yer azad olsun

    selectEl.style.display = "none";
    gameEl.style.display = "flex";
    updateInfo();
  }

  function updateInfo() {
    if (!myRole) return;
    const other = myRole === "boy" ? "girl" : "boy";
    const waiting = !players[other];
    infoEl.textContent =
      `Sən: ${CHARS[myRole].emoji} ${CHARS[myRole].name}` +
      (waiting ? " — digər oyunçu gözlənilir..." : "");
  }

  function moveTo(x, y) {
    if (!myRole) return;
    playersRef.child(myRole).update({ x, y });
  }

  // Bütün oyunçuları real-time izləyirik
  playersRef.on("value", snap => {
    players = snap.val() || {};
    render();
  });

  function render() {
    // Köhnə və ya çıxmış oyunçuları təmizlə
    Object.keys(playerEls).forEach(role => {
      if (!players[role]) {
        playerEls[role].remove();
        delete playerEls[role];
      }
    });

    // Mövcud oyunçuları yerləşdir
    Object.entries(players).forEach(([role, p]) => {
      let el = playerEls[role];
      if (!el) {
        el = document.createElement("div");
        el.className = "player";
        el.innerHTML = `<span>${p.emoji}</span><span class="tag"></span>`;
        mapEl.appendChild(el);
        playerEls[role] = el;
      }
      el.querySelector(".tag").textContent = role === myRole ? "Sən" : p.name;
      el.style.left = `${p.x * 10}%`;
      el.style.top  = `${p.y * 10}%`;
    });

    updateInfo();
  }
}
</script>
</body>
</html>
