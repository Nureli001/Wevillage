<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fermer Oyunu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(#8fd3f4, #cdeffd);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
    user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #select {
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    background: #fff; padding: 24px; border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.2); width: min(90vw, 340px);
  }
  #select h1 { font-size: 1.4rem; text-align: center; }
  .choice {
    width: 100%; font-size: 1.2rem; padding: 14px; border: none; border-radius: 12px;
    background: #4caf50; color: #fff; cursor: pointer;
  }
  .choice:disabled { background: #aaa; cursor: not-allowed; }
  #status { font-size: .95rem; color: #333; text-align: center; min-height: 1.2em; }

  #game { display: none; flex-direction: column; align-items: center; gap: 6px; }
  #info { color: #fff; font-weight: bold; text-shadow: 0 1px 3px #000; text-align: center; min-height: 1.2em; font-size: .95rem; }
  #hint { color: #fff; font-size: .85rem; text-shadow: 0 1px 3px #000; text-align: center; }
  #world {
    display: block;
    border: 4px solid #5d4037;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }

  #joy {
    display: none;
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    border: 3px solid rgba(0,0,0,.25);
    touch-action: none;
    margin-top: 4px;
  }
  @media (pointer: coarse) {
    #joy { display: block; }
    #hint { display: none; }
  }
  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    border: 2px solid rgba(0,0,0,.2);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCWli-LygY7f2KoPgCVpWpb2PsnlLWNFwM",
  authDomain: "wevillage-1102.firebaseapp.com",
  databaseURL: "https://wevillage-1102-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wevillage-1102",
  storageBucket: "wevillage-1102.firebasestorage.app",
  messagingSenderId: "790485485366",
  appId: "1:790485485366:web:8b4ead34a2208620601597"
};

// ---------- Settings ----------
const ROOM_ID = "main";
const W = 1000, H = 640;      // world size in units
const VW = 480;               // visible width in units (camera)
const SPEED = 150;            // units per second
const R = 12;                 // player collision radius
const SEND_MS = 100;          // network update throttle while moving
const IDLE_MS = 20000;        // character is removed after this much inactivity

const CHARS = {
  boy:  { name: "O\u011Flan", color: "#3f7cd9", start: { x: 430, y: 330 } },
  girl: { name: "Q\u0131z",   color: "#e0609a", start: { x: 640, y: 420 } }
};

// Lake and waterfall geometry
const LAKE = { cx: 120, cy: 480, rx: 125, ry: 80 };
const FALL = { x0: 62, x1: 124, y0: 150, y1: 402 };

// Collision obstacles
const OBST = [
  { t: "rect", x: 0, y: 0, w: 165, h: 150 },                                   // cliff
  { t: "rect", x: FALL.x0, y: FALL.y0, w: FALL.x1 - FALL.x0, h: FALL.y1 - FALL.y0 }, // waterfall
  { t: "ell", cx: LAKE.cx, cy: LAKE.cy, rx: LAKE.rx, ry: LAKE.ry }            // lake
];
const TREES = [[300,120],[380,220],[860,140],[930,300],[720,560],[470,560],[250,260],[900,520]];
TREES.forEach(([x, y]) => OBST.push({ t: "circ", x, y, r: 12 }));

function blocked(x, y) {
  for (const o of OBST) {
    if (o.t === "rect") {
      if (x > o.x - R && x < o.x + o.w + R && y > o.y - R && y < o.y + o.h + R) return true;
    } else if (o.t === "ell") {
      const a = (x - o.cx) / (o.rx + R), b = (y - o.cy) / (o.ry + R);
      if (a * a + b * b < 1) return true;
    } else {
      const dx = x - o.x, dy = y - o.y, rr = o.r + R;
      if (dx * dx + dy * dy < rr * rr) return true;
    }
  }
  return x < R || y < R || x > W - R || y > H - R;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ---------- Drawing helpers ----------
function rng(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
  g.fill();
}
function strokeSmooth(g, pts, width, color) {
  g.strokeStyle = color;
  g.lineWidth = width;
  g.lineCap = "round";
  g.lineJoin = "round";
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2;
    const my = (pts[i][1] + pts[i + 1][1]) / 2;
    g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const l = pts[pts.length - 1];
  g.lineTo(l[0], l[1]);
  g.stroke();
}

// Static background (built once)
function buildBackground() {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  const rnd = rng(42);

  // grass
  const gg = g.createLinearGradient(0, 0, 0, H);
  gg.addColorStop(0, "#a5d86b");
  gg.addColorStop(1, "#6fae3c");
  g.fillStyle = gg;
  g.fillRect(0, 0, W, H);

  // light patches and grass strokes
  for (let i = 0; i < 40; i++) {
    g.fillStyle = "rgba(255,255,200,.06)";
    g.beginPath();
    g.ellipse(rnd() * W, rnd() * H, 40 + rnd() * 60, 20 + rnd() * 30, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.strokeStyle = "rgba(50,100,25,.28)";
  g.lineWidth = 1.3;
  g.lineCap = "round";
  for (let i = 0; i < 1400; i++) {
    const x = rnd() * W, y = rnd() * H;
    g.beginPath();
    g.moveTo(x, y); g.lineTo(x - 1.5, y - 4);
    g.moveTo(x, y); g.lineTo(x + 1.5, y - 4.5);
    g.stroke();
  }

  // dirt path
  const P = [[250, 640], [330, 470], [470, 380], [600, 300], [760, 330], [900, 470], [1010, 480]];
  strokeSmooth(g, P, 58, "#a9794a");
  strokeSmooth(g, P, 46, "#c99a60");

  // tilled farm plot (future farming)
  g.fillStyle = "#7a5a3a";
  g.fillRect(560, 120, 240, 130);
  g.fillStyle = "#8d6a46";
  for (let y = 132; y < 250; y += 16) g.fillRect(568, y, 224, 7);
  g.strokeStyle = "#5a3f25";
  g.lineWidth = 3;
  g.strokeRect(560, 120, 240, 130);

  // flowers
  const flowers = ["#fff176", "#f48fb1", "#ffffff", "#ce93d8", "#ffab91"];
  for (let i = 0; i < 220; i++) {
    const x = rnd() * W, y = rnd() * H;
    if (blocked(x, y)) continue;
    g.fillStyle = flowers[i % flowers.length];
    circ(g, x, y, 2.2);
  }

  // rocks around the lake
  [[70, 560, 14], [200, 560, 11], [250, 470, 10], [40, 420, 9], [210, 405, 8]].forEach(([x, y, r]) => {
    g.fillStyle = "#8a8f96";
    g.beginPath(); g.ellipse(x, y, r, r * 0.75, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,.25)";
    g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.3, r * 0.4, r * 0.25, 0, 0, Math.PI * 2); g.fill();
  });

  // cliff (top-left)
  const cg = g.createLinearGradient(0, 0, 0, 150);
  cg.addColorStop(0, "#6d6259");
  cg.addColorStop(1, "#8b7d70");
  g.fillStyle = cg;
  g.fillRect(0, 0, 165, 150);
  g.fillStyle = "rgba(0,0,0,.18)";
  for (let i = 0; i < 14; i++) {
    g.beginPath();
    g.ellipse(rnd() * 165, rnd() * 150, 8 + rnd() * 12, 5 + rnd() * 8, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.fillStyle = "#4f463f";
  g.fillRect(0, 140, 165, 10);

  // lake
  const lg = g.createRadialGradient(100, 465, 20, LAKE.cx, LAKE.cy, 130);
  lg.addColorStop(0, "#4fc3f7");
  lg.addColorStop(1, "#0277bd");
  g.fillStyle = lg;
  g.beginPath(); g.ellipse(LAKE.cx, LAKE.cy, LAKE.rx, LAKE.ry, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,.85)";
  g.lineWidth = 3;
  g.beginPath(); g.ellipse(LAKE.cx, LAKE.cy, LAKE.rx + 1, LAKE.ry + 1, 0, 0, Math.PI * 2); g.stroke();

  // trees
  TREES.forEach(([x, y]) => {
    g.fillStyle = "rgba(0,0,0,.2)";
    g.beginPath(); g.ellipse(x, y + 2, 18, 7, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#6b4a2b";
    g.fillRect(x - 3, y - 14, 6, 16);
    g.fillStyle = "#2e7d32"; circ(g, x, y - 26, 18);
    g.fillStyle = "#43a047"; circ(g, x - 4, y - 30, 11);
    g.fillStyle = "#66bb6a"; circ(g, x - 7, y - 34, 5);
  });

  return c;
}

// Animated waterfall and lake (drawn every frame)
function drawWaterfall(g, t) {
  const { x0, x1, y0, y1 } = FALL;
  const wg = g.createLinearGradient(x0, 0, x1, 0);
  wg.addColorStop(0, "#cfefff");
  wg.addColorStop(0.5, "#ffffff");
  wg.addColorStop(1, "#9fd8f5");
  g.fillStyle = wg;
  g.fillRect(x0, y0, x1 - x0, y1 - y0);

  g.strokeStyle = "rgba(255,255,255,.85)";
  g.lineWidth = 2.2;
  g.lineCap = "round";
  for (let i = 0; i < 7; i++) {
    const x = x0 + 6 + i * 8;
    const off = (t * 180 + i * 41) % (y1 - y0);
    const len = 18 + (i % 3) * 6;
    g.beginPath();
    g.moveTo(x, y0 + off);
    g.lineTo(x, y0 + off + len);
    g.stroke();
  }

  // splash at the base
  const p = (Math.sin(t * 5) + 1) / 2;
  g.fillStyle = "rgba(255,255,255,.7)";
  g.beginPath(); g.ellipse(93, 404, 26 + p * 6, 8 + p * 2, 0, 0, Math.PI * 2); g.fill();

  // ripples and shimmer clipped to the lake
  g.save();
  g.beginPath();
  g.ellipse(LAKE.cx, LAKE.cy, LAKE.rx, LAKE.ry, 0, 0, Math.PI * 2);
  g.clip();
  for (let i = 0; i < 3; i++) {
    const k = (t * 0.5 + i / 3) % 1;
    g.strokeStyle = `rgba(255,255,255,${(1 - k) * 0.7})`;
    g.lineWidth = 1.8;
    g.beginPath();
    g.ellipse(93, 406, 12 + k * 70, 5 + k * 22, 0, 0, Math.PI * 2);
    g.stroke();
  }
  g.fillStyle = "rgba(255,255,255,.35)";
  for (let i = 0; i < 5; i++) {
    const sx = 40 + ((i * 97 + t * 20) % 160);
    const sy = 430 + ((i * 23) % 90);
    g.fillRect(sx, sy, 10, 1.5);
  }
  g.restore();
}

// Character drawn with code (no emoji)
function drawChar(g, p, t, label) {
  const x = p.x, f = p.f || 1, moving = !!p.m;
  const isBoy = p.role === "boy";
  const ph = t * 11;
  const bob = moving ? Math.abs(Math.sin(ph)) * 1.8 : Math.sin(t * 2) * 0.5;
  const sw = moving ? Math.sin(ph) * 3 : 0;
  const cy = p.y - bob;

  // shadow
  g.fillStyle = "rgba(0,0,0,.22)";
  g.beginPath(); g.ellipse(x, p.y + 9, 9, 3.5, 0, 0, Math.PI * 2); g.fill();

  // legs and shoes
  g.fillStyle = isBoy ? "#33334d" : "#5a4a7a";
  rr(g, x - 5.5 + sw, cy + 3, 4.5, 9, 2);
  rr(g, x + 1 - sw, cy + 3, 4.5, 9, 2);
  g.fillStyle = "#3a2418";
  rr(g, x - 6 + sw, cy + 10.5, 5.5, 2.5, 1.2);
  rr(g, x + 0.5 - sw, cy + 10.5, 5.5, 2.5, 1.2);

  // arms (behind body)
  g.fillStyle = "#f6cba0";
  const aw = isBoy ? 10.5 : 9;
  circ(g, x - aw, cy - 1 - sw * 0.6, 2.8);
  circ(g, x + aw, cy - 1 + sw * 0.6, 2.8);

  // body
  if (isBoy) {
    g.fillStyle = CHARS.boy.color;             // blue shirt, broader shoulders
    rr(g, x - 9, cy - 6, 18, 12, 4);
    g.fillStyle = "#5a3a1e";                   // belt
    rr(g, x - 9, cy + 2, 18, 2, 1);
  } else {
    g.fillStyle = CHARS.girl.color;            // dress
    g.beginPath();
    g.moveTo(x - 6, cy - 6);
    g.lineTo(x + 6, cy - 6);
    g.lineTo(x + 11, cy + 8);
    g.lineTo(x - 11, cy + 8);
    g.closePath();
    g.fill();
    rr(g, x - 6, cy - 6, 12, 7, 3);
  }

  const hy = cy - 16; // head center

  // girl: long hair behind the head
  if (!isBoy) {
    g.fillStyle = "#7a3e1d";
    g.beginPath(); g.ellipse(x, hy + 4, 11, 12, 0, 0, Math.PI * 2); g.fill();
  }

  // head
  g.fillStyle = "#f6cba0";
  circ(g, x, hy, 9.5);

  if (isBoy) {
    // short dark hair under a red cap, with a brim toward facing direction
    g.fillStyle = "#3a2412";
    g.beginPath(); g.ellipse(x - f * 4, hy + 2, 3.5, 3, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#d32f2f";
    g.beginPath(); g.arc(x, hy - 1, 10, Math.PI * 1.0, Math.PI * 2.0); g.closePath(); g.fill();
    g.fillStyle = "#b71c1c";
    g.beginPath(); g.ellipse(x + f * 5, hy - 2, 6.5, 2, 0, 0, Math.PI * 2); g.fill();
  } else {
    // girl: hair cap, bangs and a pink bow
    g.fillStyle = "#7a3e1d";
    g.beginPath(); g.arc(x, hy, 10, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(x + f, hy - 6, 9, 4, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ff6fa8";
    circ(g, x - f * 8, hy - 7, 2.6);
  }

  // eyes (blink now and then), looking toward facing direction
  const blink = (t % 3.2) < 0.12;
  const ox = f * 1.2;
  g.fillStyle = "#1e1e1e";
  if (blink) {
    g.fillRect(x - 4.2 + ox, hy + 0.5, 2.4, 0.8);
    g.fillRect(x + 1.8 + ox, hy + 0.5, 2.4, 0.8);
  } else {
    circ(g, x - 3 + ox, hy + 1, 1.5);
    circ(g, x + 3 + ox, hy + 1, 1.5);
    g.fillStyle = "#ffffff";
    circ(g, x - 2.5 + ox, hy + 0.4, 0.5);
    circ(g, x + 3.5 + ox, hy + 0.4, 0.5);
  }

  // cheeks and mouth
  g.fillStyle = "rgba(255,120,140,.45)";
  circ(g, x - 5.5, hy + 4, 1.8);
  circ(g, x + 5.5, hy + 4, 1.8);
  g.strokeStyle = "#8a4a3a";
  g.lineWidth = 0.8;
  g.beginPath(); g.arc(x + ox * 0.8, hy + 4, 1.8, 0.2, Math.PI - 0.2); g.stroke();

  // name tag
  if (label) {
    g.font = "bold 9px system-ui, sans-serif";
    const w = g.measureText(label).width + 8;
    g.fillStyle = "rgba(0,0,0,.55)";
    rr(g, x - w / 2, hy - 24, w, 11, 4);
    g.fillStyle = "#ffffff";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(label, x, hy - 18.5);
  }
}

// ---------- App ----------
const statusEl = document.getElementById("status");
const selectEl = document.getElementById("select");
const gameEl   = document.getElementById("game");
const infoEl   = document.getElementById("info");
const canvas   = document.getElementById("world");
const joyEl    = document.getElementById("joy");
const knobEl   = document.getElementById("knob");
const buttons  = document.querySelectorAll(".choice");

const configured = !firebaseConfig.apiKey.startsWith("YOUR_");

if (!configured) {
  statusEl.textContent = "Firebase konfigurasiyas\u0131 doldurulmay\u0131b.";
  buttons.forEach(b => b.disabled = true);
} else {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const playersRef = db.ref(`rooms/${ROOM_ID}/players`);
  const g = canvas.getContext("2d");
  const bgCanvas = buildBackground();

  let me = null;            // my character (null while on the selection screen)
  let players = {};         // raw data from Firebase
  const remote = {};        // other players, interpolated
  const seenA = {};         // role -> { a, at }: when we last saw that player's activity change
  let joining = false;
  let loopStarted = false;
  let statusMsg = "";
  let lastSent = 0, lastKey = "";
  let t = 0, lastFrame = performance.now();

  // ----- Input: keyboard -----
  const keysDown = new Set();
  const KEYS = {
    w: [0, -1], arrowup: [0, -1],
    s: [0, 1],  arrowdown: [0, 1],
    a: [-1, 0], arrowleft: [-1, 0],
    d: [1, 0],  arrowright: [1, 0]
  };
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (KEYS[k]) { e.preventDefault(); keysDown.add(k); }
  });
  document.addEventListener("keyup", e => keysDown.delete(e.key.toLowerCase()));
  window.addEventListener("blur", () => { keysDown.clear(); joy = { x: 0, y: 0 }; });

  // ----- Input: joystick -----
  let joy = { x: 0, y: 0 };
  function setJoy(e) {
    const r = joyEl.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const max = r.width / 2 - 28;
    const d = Math.hypot(dx, dy) || 1;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    const mag = Math.min(1, Math.hypot(dx, dy) / max);
    const len = Math.hypot(dx, dy) || 1;
    joy = mag < 0.15 ? { x: 0, y: 0 } : { x: (dx / len) * mag, y: (dy / len) * mag };
  }
  joyEl.addEventListener("pointerdown", e => {
    if (!me) return;
    joyEl.setPointerCapture(e.pointerId);
    setJoy(e);
  });
  joyEl.addEventListener("pointermove", e => {
    if (joyEl.hasPointerCapture(e.pointerId)) setJoy(e);
  });
  function releaseJoy() {
    joy = { x: 0, y: 0 };
    knobEl.style.transform = "translate(-50%, -50%)";
  }
  joyEl.addEventListener("pointerup", releaseJoy);
  joyEl.addEventListener("pointercancel", releaseJoy);

  function inputVec() {
    let x = 0, y = 0;
    keysDown.forEach(k => { x += KEYS[k][0]; y += KEYS[k][1]; });
    if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
    return joy;
  }

  // ----- Availability -----
  function isStale(role) {
    const s = seenA[role];
    return !s || Date.now() - s.at > IDLE_MS;
  }
  function isAlive(role) {
    return !!players[role] && !isStale(role);
  }

  // ----- Real-time sync -----
  playersRef.on("value", snap => {
    const data = snap.val() || {};
    const now = Date.now();
    players = data;
    for (const role of Object.keys(data)) {
      const p = data[role];
      // Record the time we last saw this player's activity marker change
      if (!seenA[role] || seenA[role].a !== p.a) seenA[role] = { a: p.a, at: now };
    }
    for (const role of Object.keys(seenA)) {
      if (!data[role]) delete seenA[role];
    }
    syncRemote();
    updateInfo();
    refreshButtons();
  });

  function syncRemote() {
    for (const role of Object.keys(remote)) {
      if (!isAlive(role) || (me && role === me.role)) delete remote[role];
    }
    for (const role of Object.keys(players)) {
      if (me && role === me.role) continue;
      if (!isAlive(role)) continue;
      const p = players[role];
      if (!remote[role]) remote[role] = { x: p.x, y: p.y };
      Object.assign(remote[role], { role, tx: p.x, ty: p.y, f: p.f || 1, m: !!p.m, name: p.name });
    }
  }

  function sendState(now) {
    const key = `${me.x.toFixed(1)}|${me.y.toFixed(1)}|${me.f}|${me.m}`;
    if (key === lastKey) return;
    if (me.m && now - lastSent < SEND_MS) return;
    lastKey = key;
    lastSent = now;
    playersRef.child(me.role).update({
      x: +me.x.toFixed(1), y: +me.y.toFixed(1), f: me.f, m: me.m, a: Date.now()
    });
  }

  // ----- Selection screen -----
  function refreshButtons() {
    if (me || joining) return;
    buttons.forEach(b => { b.disabled = isAlive(b.dataset.role); });
    statusEl.textContent = statusMsg || "Karakter se\u00E7in";
  }

  // Housekeeping every second: remove idle players, refresh availability
  setInterval(() => {
    const now = Date.now();
    for (const role of Object.keys(players)) {
      if (me && role === me.role) continue;
      if (isStale(role)) playersRef.child(role).remove();
    }
    if (me && now - me.lastAct > IDLE_MS) {
      kickSelf("20 saniy\u0259 h\u0259r\u0259k\u0259t olmad\u0131\u011F\u0131 \u00FC\u00E7\u00FCn oyundan \u00E7\u0131xar\u0131ld\u0131n.");
    }
    syncRemote();
    refreshButtons();
  }, 1000);

  function kickSelf(msg) {
    if (!me) return;
    const role = me.role;
    playersRef.child(role).onDisconnect().cancel();
    playersRef.child(role).remove();
    me = null;
    lastKey = "";
    remote && Object.keys(remote).forEach(k => delete remote[k]);
    statusMsg = msg;
    gameEl.style.display = "none";
    selectEl.style.display = "flex";
    refreshButtons();
  }

  // ----- Joining -----
  buttons.forEach(btn => btn.addEventListener("click", () => joinAs(btn.dataset.role)));

  async function joinAs(role) {
    if (isAlive(role)) {
      statusMsg = "Bu karakter art\u0131q tutulub. Dig\u0259rini se\u00E7in.";
      statusEl.textContent = statusMsg;
      return;
    }
    joining = true;
    buttons.forEach(b => b.disabled = true);
    statusMsg = "Qo\u015Fulur...";
    statusEl.textContent = statusMsg;

    const slotRef = playersRef.child(role);
    const start = CHARS[role].start;
    const result = await slotRef.transaction(current => {
      if (current) return; // already taken in the database
      return { name: CHARS[role].name, x: start.x, y: start.y, f: 1, m: false, a: Date.now() };
    });
    joining = false;

    if (!result.committed) {
      statusMsg = "Bu karakter art\u0131q tutulub. Dig\u0259rini se\u00E7in.";
      refreshButtons();
      return;
    }

    me = { role, x: start.x, y: start.y, f: 1, m: false, lastAct: Date.now() };
    lastKey = "";
    statusMsg = "";
    slotRef.onDisconnect().remove();

    selectEl.style.display = "none";
    gameEl.style.display = "flex";
    resizeCanvas();
    syncRemote();
    updateInfo();
    if (!loopStarted) {
      loopStarted = true;
      lastFrame = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function updateInfo() {
    if (!me) return;
    const other = me.role === "boy" ? "girl" : "boy";
    const waiting = !isAlive(other);
    infoEl.textContent = `S\u0259n: ${CHARS[me.role].name}` +
      (waiting ? " \u2014 dig\u0259r oyun\u00E7u g\u00F6zl\u0259nilir..." : "");
  }

  // ----- Canvas sizing -----
  function resizeCanvas() {
    const cw = Math.min(window.innerWidth - 16, 760);
    const ch = Math.round(Math.min(cw * 0.75, window.innerHeight * 0.62));
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
  }
  window.addEventListener("resize", resizeCanvas);

  // ----- Game loop -----
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    t += dt;

    if (me) {
      const d = inputVec();
      me.m = !!(d.x || d.y);
      if (me.m) {
        me.lastAct = Date.now();
        const nx = me.x + d.x * SPEED * dt;
        const ny = me.y + d.y * SPEED * dt;
        if (!blocked(nx, me.y)) me.x = nx;
        if (!blocked(me.x, ny)) me.y = ny;
        if (Math.abs(d.x) > 0.2) me.f = d.x < 0 ? -1 : 1;
      }
      sendState(now);
    }

    for (const k in remote) {
      const r = remote[k];
      const a = Math.min(1, dt * 12);
      r.x += (r.tx - r.x) * a;
      r.y += (r.ty - r.y) * a;
    }

    if (me) render(t);
    requestAnimationFrame(loop);
  }

  function render(time) {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }

    const s = cw / VW;                 // css px per world unit
    const vh = ch / s;                 // visible height in world units
    const camX = clamp(me.x - VW / 2, 0, W - VW);
    const camY = clamp(me.y - vh / 2, 0, H - vh);

    g.setTransform(dpr * s, 0, 0, dpr * s, -camX * dpr * s, -camY * dpr * s);
    g.fillStyle = "#6fae3c";
    g.fillRect(camX, camY, VW, vh);
    g.drawImage(bgCanvas, 0, 0, W, H);
    drawWaterfall(g, time);

    const list = [{ role: me.role, x: me.x, y: me.y, f: me.f, m: me.m, label: "S\u0259n" }];
    for (const k in remote) {
      const r = remote[k];
      list.push({ role: k, x: r.x, y: r.y, f: r.f, m: r.m, label: r.name });
    }
    list.sort((a, b) => a.y - b.y);
    list.forEach(p => drawChar(g, p, time, p.label));
  }
}
</script>
